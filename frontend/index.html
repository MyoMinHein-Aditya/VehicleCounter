<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>VEHICLE DETECTOR</h2>
        
        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="detectVehicles()">Detect</button>
        </div>

        <div id="errorMessage" class="error"></div>

        <div id="resultsSection" class="results-hidden">
            <h3>RESULT</h3>
            <div class="stats">
                <p>Cars: <span id="carCount">0</span></p>
                <p>Motorcycles: <span id="motoCount">0</span></p>
                <p><strong>Total: <span id="totalCount">0</span></strong></p>
            </div>
            
            <div class="image-wrapper">
                <img id="resultImage" alt="Annotated Image">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
